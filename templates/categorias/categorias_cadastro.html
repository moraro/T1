<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Categorias - CineStream</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg" style="background-color:#dc3545;">
    <div class="container-fluid px-4">
      <a class="navbar-brand text-white fw-bold" href="{{ url_for('listar_usuarios') }}">CineStream</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('listar_usuarios') }}">Usuários</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('listar_filmes') }}">Filmes/Séries</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('listar_categorias') }}">Categorias</a></li>
        </ul>
        <a href="{{ url_for('login') }}" class="btn btn-dark">Sair</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4">
    <h2 class="my-4">Cadastro de Categorias</h2>

    {% if erros %}
      <div class="alert alert-danger">
        <ul class="mb-0">
          {% for erro in erros %}
          <li>{{ erro }}</li>
          {% endfor %}
        </ul>
      </div>
    {% endif %}

    {% if sucesso %}
      <div class="alert alert-success">Categoria cadastrada com sucesso!</div>
    {% endif %}

    <form method="POST" action="{{ url_for('cadastrar_categoria') }}" class="border rounded p-4 bg-white">
      <div class="mb-3">
        <label class="form-label">Nome:</label>
        <input type="text" name="nome" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Descrição:</label>
        <textarea name="descricao" class="form-control" rows="3"></textarea>
      </div>

      <div class="d-flex justify-content-between">
        <a href="{{ url_for('listar_categorias') }}">Voltar</a>
        <button type="submit" class="btn btn-success">Salvar</button>
      </div>
    </form>
  </div>

</body>
</html>
