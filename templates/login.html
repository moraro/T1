{% extends 'layout/base_limpa.html' %}

{% block titulo %} Tela de Login!! {% endblock %}

{% block conteudo %}

  <div class="d-flex justify-content-center align-items-center" style="min-height:100vh;">
    <div class="card shadow-sm" style="width:100%; max-width:400px;">
      <div class="card-body p-4">
        <h2 class="text-center mb-1">CineStream</h2>
        <p class="text-center text-muted mb-4">Plataforma de Streaming</p>

        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label class="form-label">E-mail:</label>
            <input type="email" name="email" class="form-control" placeholder="Digite seu e-mail" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Senha:</label>
            <input type="password" name="senha" class="form-control" placeholder="Digite sua senha" required>
          </div>
          <button type="submit" class="btn btn-danger w-100 mb-2">Entrar</button>
          <a href="{{ url_for('cadastrar_usuario') }}" class="btn btn-primary w-100">Cadastrar</a>
        </form>
      </div>
    </div>
   </div> 

{% endblock %}
