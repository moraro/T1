<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listagem de Categorias - CineStream</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg" style="background-color:#dc3545;">
    <div class="container-fluid px-4">
      <a class="navbar-brand text-white fw-bold" href="{{ url_for('listar_usuarios') }}">CineStream</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('listar_usuarios') }}">Usuários</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('listar_filmes') }}">Filmes/Séries</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('listar_categorias') }}">Categorias</a></li>
        </ul>
        <a href="{{ url_for('login') }}" class="btn btn-dark">Sair</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center my-4">
      <h2>Listagem de Categorias</h2>
      <a href="{{ url_for('cadastrar_categoria') }}" class="btn btn-success">Adicionar</a>
    </div>

    <table class="table table-hover bg-white">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Descrição</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        {% for categoria in categorias %}
        <tr>
          <td>{{ categoria.id }}</td>
          <td>{{ categoria.nome }}</td>
          <td>{{ categoria.descricao }}</td>
          <td>
            <a href="{{ url_for('excluir_categoria', categoria_id=categoria.id) }}" class="btn btn-danger btn-sm">Excluir</a>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-center">Nenhuma categoria cadastrada.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

</body>
</html>
