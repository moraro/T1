<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
        {% block titulo %}
        CineStream
        {% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg" style="background-color:#dc3545;">

        <div class="container-fluid px-4">

            <a class="navbar-brand text-white fw-bold" href="{{ url_for('listar_usuarios') }}">CineStream</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-white"
                            href="{{ url_for('listar_usuarios') }}">Usuários</a></li>
                    <li class="nav-item"><a class="nav-link text-white"
                            href="{{ url_for('listar_filmes') }}">Filmes/Séries</a></li>
                    <li class="nav-item"><a class="nav-link text-white"
                            href="{{ url_for('listar_categorias') }}">Categorias</a></li>
                </ul>
                <a href="{{ url_for('login') }}" class="btn btn-dark">Sair</a>
            </div>
        </div>

    </nav>
    <main>

        {% block conteudo %}

        {% endblock %}

    </main>

</body>

</html>
