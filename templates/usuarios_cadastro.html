<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Usuários - CineStream</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg" style="background-color:#dc3545;">
    <div class="container-fluid px-4">
      <a class="navbar-brand text-white fw-bold" href="{{ url_for('listar_usuarios') }}">CineStream</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('listar_usuarios') }}">Usuários</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('listar_filmes') }}">Filmes/Séries</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('listar_categorias') }}">Categorias</a></li>
        </ul>
        <a href="{{ url_for('login') }}" class="btn btn-dark">Sair</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4">
    <h2 class="my-4">Cadastro de Usuários</h2>

    {% if erros %}
      <div class="alert alert-danger">
        <ul class="mb-0">
          {% for erro in erros %}
          <li>{{ erro }}</li>
          {% endfor %}
        </ul>
      </div>
    {% endif %}

    {% if sucesso %}
      <div class="alert alert-success">Usuário cadastrado com sucesso!</div>
    {% endif %}

    <form method="POST" action="{{ url_for('cadastrar_usuario') }}" class="border rounded p-4 bg-white">
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Nome:</label>
          <input type="text" name="nome" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label">Email:</label>
          <input type="email" name="email" class="form-control">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3">
          <label class="form-label">Celular:</label>
          <input type="text" name="celular" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">Data de Nascimento:</label>
          <input type="date" name="data_nascimento" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">CPF:</label>
          <input type="text" name="cpf" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">Nível de Acesso:</label>
          <select name="nivel" class="form-select">
            <option value="">-- Escolha --</option>
            <option value="Usuário">Usuário</option>
            <option value="Administrador">Administrador</option>
          </select>
        </div>
      </div>

      <div class="d-flex justify-content-between">
        <a href="{{ url_for('listar_usuarios') }}">Voltar</a>
        <button type="submit" class="btn btn-success">Salvar</button>
      </div>
    </form>
  </div>

</body>
</html>
